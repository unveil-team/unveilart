name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        run: |
          supabase functions deploy admin-artworks --project-ref ${{ secrets.ADMIN_PROJECT_ID }}
          supabase functions deploy public-artists  --project-ref ${{ secrets.ADMIN_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.ADMIN_ACCESS_TOKEN }}
