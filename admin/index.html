<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — UnveilArt Admin</title>
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<nav class="admin-nav">
  <div class="logo"><b>Unveil</b>Art <span style="font-size:13px;letter-spacing:0.14em;font-style:normal;color:rgba(250,250,247,0.45);margin-left:12px;">ADMIN</span></div>
  <div class="nav-right">
    <a href="index.html" class="nav-active">Dashboard</a>
    <a href="venues.html">Venues</a>
    <a href="artists.html">Artists</a>
    <button class="btn-logout" id="btn-logout">Logout</button>
  </div>
</nav>

<div class="admin-wrap">
  <h1 class="page-title">Dashboard</h1>

  <div class="summary-grid">
    <div class="summary-card">
      <div class="label">Active Venues</div>
      <div class="value" id="stat-venues">—</div>
      <div class="sub">Currently billing</div>
    </div>
    <div class="summary-card">
      <div class="label">Monthly Revenue</div>
      <div class="value" id="stat-revenue">—</div>
      <div class="sub">AUD ex-GST</div>
    </div>
    <div class="summary-card">
      <div class="label">Installed Artworks</div>
      <div class="value" id="stat-artworks">—</div>
      <div class="sub">Across all venues</div>
    </div>
    <div class="summary-card">
      <div class="label">Past Due</div>
      <div class="value" id="stat-pastdue">—</div>
      <div class="sub">Require attention</div>
    </div>
  </div>

  <div class="dashboard-actions">
    <a href="venues.html" class="dashboard-action-card">
      <div class="dashboard-action-title">Venues</div>
      <div class="dashboard-action-sub">Manage venue accounts &amp; billing</div>
    </a>
    <a href="artists.html" class="dashboard-action-card">
      <div class="dashboard-action-title">Artists</div>
      <div class="dashboard-action-sub">Manage artist profiles &amp; works</div>
    </a>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
