<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Artists — UnveilArt Admin</title>
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="main-content">
  <div class="admin-wrap">
    <div id="breadcrumb-wrap"></div>

    <div class="page-header">
      <div class="page-title-row">
        <h1 class="page-title">Artists</h1>
        <button class="btn-primary" id="btn-add-artist">+ Add Artist</button>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search artists…" autocomplete="off" />
          </div>
          <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="active">Active</button>
            <button class="filter-tab" data-filter="inactive">Inactive</button>
          </div>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Genre</th>
            <th>Email</th>
            <th>Instagram</th>
            <th>Installed Works</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="artists-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add Artist Modal -->
<div class="modal-backdrop" id="modal-artist">
  <div class="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <h2 class="modal-title">Add Artist</h2>
    <form id="form-artist" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="f-name">Name *</label>
          <input type="text" id="f-name" name="name" required />
        </div>
        <div class="form-group">
          <label for="f-email">Email</label>
          <input type="email" id="f-email" name="email" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="f-phone">Phone</label>
          <input type="tel" id="f-phone" name="phone" />
        </div>
        <div class="form-group">
          <label for="f-instagram">Instagram</label>
          <input type="text" id="f-instagram" name="instagram" placeholder="@handle" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="f-website">Website</label>
          <input type="url" id="f-website" name="website" placeholder="https://" />
        </div>
        <div class="form-group">
          <label for="f-genre">Genre</label>
          <input type="text" id="f-genre" name="genre" placeholder="e.g. Photography, Oil Painting" />
        </div>
      </div>
      <div class="form-group">
        <label for="f-bio">Bio</label>
        <textarea id="f-bio" name="bio" placeholder="Short artist biography…"></textarea>
      </div>
      <div class="form-group">
        <label for="f-notes">Notes</label>
        <textarea id="f-notes" name="notes"></textarea>
      </div>
      <div id="form-error" class="alert-row alert-error" style="display:none;">
        <div class="alert-body"><span id="form-error-msg"></span></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-secondary" id="btn-cancel">Cancel</button>
        <button type="submit" class="btn-primary" id="btn-save">Save Artist</button>
      </div>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  initPage({ page: 'artists' });

  let allArtists   = [];
  let currentFilter = 'all';
  let searchQuery   = '';

  const tbody = document.getElementById('artists-tbody');
  const modal  = document.getElementById('modal-artist');
  const form   = document.getElementById('form-artist');

  // ── Load ───────────────────────────────────────────────────
  async function loadArtists() {
    tbody.innerHTML = skeleton(6, 7);
    try {
      const data = await API.artists.list();
      allArtists = Array.isArray(data) ? data : (data.artists || []);
      renderTable();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="7" class="empty-state">Failed to load artists: ${esc(err.message)}</td></tr>`;
    }
  }

  // ── Render ─────────────────────────────────────────────────
  function renderTable() {
    let rows = allArtists;

    if (currentFilter !== 'all') {
      rows = rows.filter(a => a.status === currentFilter);
    }

    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      rows = rows.filter(a =>
        (a.name  || '').toLowerCase().includes(q) ||
        (a.email || '').toLowerCase().includes(q) ||
        (a.genre || '').toLowerCase().includes(q)
      );
    }

    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No artists found.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(a => {
      const igHandle = a.instagram ? a.instagram.replace(/^@/, '') : null;
      const igCell   = igHandle
        ? `<a href="https://instagram.com/${esc(igHandle)}" target="_blank" rel="noopener" style="color:var(--gold-deep)">@${esc(igHandle)}</a>`
        : '—';

      return `<tr>
        <td><a href="artist.html?id=${esc(a.id)}" class="venue-name-link">${esc(a.name)}</a></td>
        <td>${esc(a.genre || '—')}</td>
        <td>${esc(a.email || '—')}</td>
        <td>${igCell}</td>
        <td>${a.installed_count != null ? a.installed_count : 0}</td>
        <td>${badge(a.status)}</td>
        <td><a href="artist.html?id=${esc(a.id)}" class="action-btn">View →</a></td>
      </tr>`;
    }).join('');
  }

  // ── Filter tabs ────────────────────────────────────────────
  document.querySelectorAll('.filter-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderTable();
    });
  });

  // ── Search ─────────────────────────────────────────────────
  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    renderTable();
  });

  // ── Modal open/close ───────────────────────────────────────
  document.getElementById('btn-add-artist').addEventListener('click', () => {
    form.reset();
    document.getElementById('form-error').style.display = 'none';
    modal.classList.add('open');
  });
  document.getElementById('modal-close').addEventListener('click', () => modal.classList.remove('open'));
  document.getElementById('btn-cancel').addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });

  // ── Save ───────────────────────────────────────────────────
  form.addEventListener('submit', async e => {
    e.preventDefault();

    const errEl  = document.getElementById('form-error');
    const errMsg = document.getElementById('form-error-msg');
    errEl.style.display = 'none';

    const name = form.name.value.trim();
    if (!name) {
      errMsg.textContent = 'Artist name is required.';
      errEl.style.display = '';
      return;
    }

    const btn = document.getElementById('btn-save');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const igRaw = form.instagram.value.trim();
    const data = {
      name,
      email:     form.email.value.trim()     || null,
      phone:     form.phone.value.trim()     || null,
      instagram: igRaw ? igRaw.replace(/^@/, '') : null,
      website:   form.website.value.trim()   || null,
      genre:     form.genre.value.trim()     || null,
      bio:       form.bio.value.trim()       || null,
      notes:     form.notes.value.trim()     || null,
    };

    try {
      const newArtist = await API.artists.create(data);
      modal.classList.remove('open');
      toast('Artist created', 'success');
      window.location.href = 'artist.html?id=' + newArtist.id;
    } catch (err) {
      errMsg.textContent = err.message || 'Failed to create artist.';
      errEl.style.display = '';
      btn.disabled = false;
      btn.textContent = 'Save Artist';
    }
  });

  // ── Init ───────────────────────────────────────────────────
  loadArtists();
</script>
</body>
</html>
