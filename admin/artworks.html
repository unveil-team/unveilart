<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Artworks — UnveilArt Admin</title>
<link rel="stylesheet" href="css/admin.css" />
<style>
  .btn-danger { background: var(--red, #c0392b); color: #fff; border: none; font-size: 12px; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  .btn-danger:hover { opacity: 0.85; }
</style>
</head>
<body>
<div class="main-content">
  <div class="admin-wrap">
    <div id="breadcrumb-wrap"></div>

    <div class="page-header">
      <div class="page-title-row">
        <h1 class="page-title">Artworks</h1>
        <button class="btn-primary" id="btn-add-artwork">+ Add Artwork</button>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search artworks…" autocomplete="off" />
          </div>
          <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="installed">Installed</button>
            <button class="filter-tab" data-filter="stored">Stored</button>
            <button class="filter-tab" data-filter="sold">Sold</button>
          </div>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Artist</th>
            <th>Venue</th>
            <th>Price</th>
            <th>Tier</th>
            <th>Status</th>
            <th>Installed At</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="artworks-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add Artwork Modal -->
<div class="modal-backdrop" id="modal-artwork">
  <div class="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <h2 class="modal-title">Add Artwork</h2>
    <form id="form-artwork" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="f-title">Title *</label>
          <input type="text" id="f-title" name="title" required />
        </div>
        <div class="form-group">
          <label for="f-artist">Artist *</label>
          <select id="f-artist" name="artist_id" required>
            <option value="">Select artist…</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="f-price">Price (AUD)</label>
          <input type="number" id="f-price" name="price" min="0" step="0.01" placeholder="0.00" />
        </div>
        <div class="form-group" style="display:flex;align-items:flex-end;gap:10px;">
          <div style="flex:1;">
            <label>Price Tier</label>
            <div id="tier-preview" style="padding:8px 0 12px;font-size:14px;color:var(--stone-gray);">—</div>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="f-venue">Venue (optional)</label>
          <select id="f-venue" name="venue_id">
            <option value="">No venue / Stored</option>
          </select>
        </div>
        <div class="form-group">
          <label for="f-quantity">Quantity</label>
          <input type="number" id="f-quantity" name="quantity" min="1" step="1" placeholder="1" />
        </div>
      </div>
      <div class="form-group">
        <label for="f-memo">Memo</label>
        <textarea id="f-memo" name="memo" placeholder="Any notes about this artwork…"></textarea>
      </div>
      <div id="form-error" class="alert-row alert-error" style="display:none;">
        <div class="alert-body"><span id="form-error-msg"></span></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-secondary" id="btn-cancel">Cancel</button>
        <button type="submit" class="btn-primary" id="btn-save">Add Artwork</button>
      </div>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  initPage({ page: 'artworks' });

  let allArtworks   = [];
  let currentFilter = 'all';
  let searchQuery   = '';

  // Pre-filter from URL params (e.g. ?status=installed from dashboard)
  const urlParams = new URLSearchParams(window.location.search);
  const urlStatus = urlParams.get('status');
  if (urlStatus) {
    currentFilter = urlStatus;
    document.querySelectorAll('.filter-tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === urlStatus);
    });
  }

  const tbody = document.getElementById('artworks-tbody');
  const modal  = document.getElementById('modal-artwork');
  const form   = document.getElementById('form-artwork');

  // ── Load ───────────────────────────────────────────────────
  async function loadArtworks() {
    tbody.innerHTML = skeleton(8, 8);
    try {
      const data = await API.artworks.list();
      allArtworks = Array.isArray(data) ? data : (data.artworks || []);
      renderTable();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="8" class="empty-state">Failed to load artworks: ${esc(err.message)}</td></tr>`;
    }
  }

  // ── Render ─────────────────────────────────────────────────
  function renderTable() {
    let rows = allArtworks;

    if (currentFilter !== 'all') {
      rows = rows.filter(a => a.status === currentFilter);
    }

    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      rows = rows.filter(a =>
        (a.title       || '').toLowerCase().includes(q) ||
        (a.artist_name || '').toLowerCase().includes(q) ||
        (a.venue_name  || '').toLowerCase().includes(q)
      );
    }

    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="empty-state">No artworks found.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(a => {
      const tier = a.price_tier || priceTier(a.price);

      const artistCell = a.artist_id
        ? `<a href="artist.html?id=${esc(a.artist_id)}" class="venue-name-link">${esc(a.artist_name || a.artist_id)}</a>`
        : '—';

      const venueCell = a.venue_id
        ? `<a href="venue.html?id=${esc(a.venue_id)}" class="venue-name-link">${esc(a.venue_name || a.venue_id)}</a>`
        : '—';

      return `<tr>
        <td><a href="artwork.html?id=${esc(a.id)}" class="venue-name-link">${esc(a.title)}</a></td>
        <td>${artistCell}</td>
        <td>${venueCell}</td>
        <td>${a.price != null ? formatCurrency(a.price) : '—'}</td>
        <td>${badge(tier, priceTierLabel(tier))}</td>
        <td>${badge(a.status)}</td>
        <td>${formatDate(a.installed_at)}</td>
        <td style="display:flex;gap:6px;align-items:center;">
          <a href="artwork.html?id=${esc(a.id)}" class="action-btn">View →</a>
          <button class="action-btn btn-danger" onclick="deleteArtwork('${esc(a.id)}', '${esc(a.title)}')">Delete</button>
        </td>
      </tr>`;
    }).join('');
  }

  // ── Filter tabs ────────────────────────────────────────────
  document.querySelectorAll('.filter-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderTable();
    });
  });

  // ── Search ─────────────────────────────────────────────────
  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    renderTable();
  });

  // ── Price tier preview ─────────────────────────────────────
  document.getElementById('f-price').addEventListener('input', e => {
    const price = parseFloat(e.target.value);
    const preview = document.getElementById('tier-preview');
    if (!price || isNaN(price)) {
      preview.innerHTML = '—';
      return;
    }
    const tier = priceTier(price);
    preview.innerHTML = badge(tier, priceTierLabel(tier));
  });

  // ── Modal open/close ───────────────────────────────────────
  document.getElementById('btn-add-artwork').addEventListener('click', async () => {
    form.reset();
    document.getElementById('form-error').style.display = 'none';
    document.getElementById('tier-preview').innerHTML = '—';

    // Load artists and venues in parallel
    try {
      const [artistData, venueData] = await Promise.all([
        API.artists.list(),
        API.venues.list(),
      ]);
      const artists = Array.isArray(artistData) ? artistData : (artistData.artists || []);
      const venues  = Array.isArray(venueData)  ? venueData  : (venueData.venues   || []);

      const artistSel = document.getElementById('f-artist');
      artistSel.innerHTML = '<option value="">Select artist…</option>' +
        artists.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');

      const venueSel = document.getElementById('f-venue');
      venueSel.innerHTML = '<option value="">No venue / Stored</option>' +
        venues.map(v => `<option value="${esc(v.id)}">${esc(v.name)}</option>`).join('');
    } catch (e) { /* continue anyway */ }

    modal.classList.add('open');
  });

  document.getElementById('modal-close').addEventListener('click', () => modal.classList.remove('open'));
  document.getElementById('btn-cancel').addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });

  // ── Save ───────────────────────────────────────────────────
  form.addEventListener('submit', async e => {
    e.preventDefault();

    const errEl  = document.getElementById('form-error');
    const errMsg = document.getElementById('form-error-msg');
    errEl.style.display = 'none';

    const title    = document.getElementById('f-title').value.trim();
    const artistId = document.getElementById('f-artist').value || null;
    if (!title) {
      errMsg.textContent = 'Artwork title is required.';
      errEl.style.display = '';
      return;
    }
    if (!artistId) {
      errMsg.textContent = 'Artist is required.';
      errEl.style.display = '';
      return;
    }

    const btn = document.getElementById('btn-save');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const venueId  = document.getElementById('f-venue').value || null;
    const qty      = parseInt(document.getElementById('f-quantity').value) || 1;
    const memo     = document.getElementById('f-memo').value.trim() || null;

    const data = {
      title,
      artist_id: artistId,
      venue_id:  venueId,
      price:     parseFloat(document.getElementById('f-price').value) || null,
      quantity:  qty,
      memo,
      status:    venueId ? 'installed' : 'stored',
    };

    try {
      await API.artworks.create(data);
      modal.classList.remove('open');
      toast('Artwork added', 'success');
      loadArtworks();
    } catch (err) {
      errMsg.textContent = err.message || 'Failed to add artwork.';
      errEl.style.display = '';
      btn.disabled = false;
      btn.textContent = 'Add Artwork';
    }
  });

  // ── Delete ─────────────────────────────────────────────────
  async function deleteArtwork(id, title) {
    if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
    try {
      await API.artworks.delete(id);
      toast('Artwork deleted', 'success');
      loadArtworks();
    } catch (err) {
      toast(err.message || 'Failed to delete artwork.', 'error');
    }
  }

  // ── Init ───────────────────────────────────────────────────
  loadArtworks();
</script>
</body>
</html>
