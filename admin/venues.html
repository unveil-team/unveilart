<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Venues — UnveilArt Admin</title>
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<div class="main-content">
  <div class="admin-wrap">
    <div id="breadcrumb-wrap"></div>

    <div class="page-header">
      <div class="page-title-row">
        <h1 class="page-title">Venues</h1>
        <button class="btn-primary" id="btn-add-venue">+ Add Venue</button>
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search venues…" autocomplete="off" />
          </div>
          <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="active">Active</button>
            <button class="filter-tab" data-filter="past_due">Past Due</button>
            <button class="filter-tab" data-filter="inactive">Inactive</button>
            <button class="filter-tab" data-filter="cancelled">Cancelled</button>
          </div>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Venue</th>
            <th>Type</th>
            <th>Contact</th>
            <th>Artworks</th>
            <th>Monthly</th>
            <th>Status</th>
            <th>Next Billing</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="venues-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add Venue Modal -->
<div class="modal-backdrop" id="modal-venue">
  <div class="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <h2 class="modal-title">Add Venue</h2>
    <form id="form-venue" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="f-name">Venue Name *</label>
          <input type="text" id="f-name" name="name" required />
        </div>
        <div class="form-group">
          <label for="f-type">Venue Type</label>
          <select id="f-type" name="venue_type">
            <option value="">Select…</option>
            <option value="hotel">Hotel</option>
            <option value="restaurant">Restaurant</option>
            <option value="cafe">Café</option>
            <option value="bar">Bar</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="f-contact">Contact Name</label>
          <input type="text" id="f-contact" name="contact_name" />
        </div>
        <div class="form-group">
          <label for="f-email">Email *</label>
          <input type="email" id="f-email" name="email" required />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="f-phone">Phone</label>
          <input type="tel" id="f-phone" name="phone" />
        </div>
        <div class="form-group">
          <label for="f-address">Address</label>
          <input type="text" id="f-address" name="address" />
        </div>
      </div>
      <div class="form-group">
        <label for="f-notes">Notes</label>
        <textarea id="f-notes" name="notes"></textarea>
      </div>
      <div id="form-error" class="alert-row alert-error" style="display:none;">
        <div class="alert-body"><span id="form-error-msg"></span></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-secondary" id="btn-cancel-modal">Cancel</button>
        <button type="submit" class="btn-primary" id="btn-save-venue">Save Venue</button>
      </div>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  initPage({ page: 'venues' });

  let allVenues = [];
  let currentFilter = 'all';
  let searchQuery = '';

  const tbody = document.getElementById('venues-tbody');
  const modal = document.getElementById('modal-venue');
  const form  = document.getElementById('form-venue');

  // ── Load data ──────────────────────────────────────────────
  async function loadVenues() {
    tbody.innerHTML = skeleton(6, 8);
    try {
      const data = await API.venues.list();
      allVenues = Array.isArray(data) ? data : (data.venues || []);
      renderTable();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="8" class="empty-state">Failed to load venues: ${esc(err.message)}</td></tr>`;
    }
  }

  // ── Render table ───────────────────────────────────────────
  function renderTable() {
    // Cancelled venues are hidden from "All" — view them under the Cancelled tab
    let rows = currentFilter === 'all'
      ? allVenues.filter(v => v.status !== 'cancelled')
      : allVenues.filter(v => v.status === currentFilter);

    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      rows = rows.filter(v =>
        (v.name || '').toLowerCase().includes(q) ||
        (v.contact_name || '').toLowerCase().includes(q)
      );
    }

    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="empty-state">No venues found.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(v => {
      const monthly = v.artwork_count > 0
        ? formatCurrency(v.monthly_total) + ' inc. GST'
        : '—';

      const typeLabel = v.venue_type
        ? v.venue_type.charAt(0).toUpperCase() + v.venue_type.slice(1)
        : '—';

      return `<tr>
        <td><a href="venue.html?id=${esc(v.id)}" class="venue-name-link">${esc(v.name)}</a></td>
        <td>${esc(typeLabel)}</td>
        <td>${esc(v.contact_name || '—')}</td>
        <td>${v.artwork_count != null ? v.artwork_count : '—'}</td>
        <td>${esc(monthly)}</td>
        <td>${badge(v.status)}</td>
        <td>${v.next_billing_date ? formatDate(v.next_billing_date) : '—'}</td>
        <td><a href="venue.html?id=${esc(v.id)}" class="action-btn">View →</a></td>
      </tr>`;
    }).join('');
  }

  // ── Filter tabs ────────────────────────────────────────────
  document.querySelectorAll('.filter-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderTable();
    });
  });

  // ── Search ─────────────────────────────────────────────────
  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    renderTable();
  });

  // ── Modal open/close ───────────────────────────────────────
  document.getElementById('btn-add-venue').addEventListener('click', () => {
    form.reset();
    document.getElementById('form-error').style.display = 'none';
    modal.classList.add('open');
  });

  document.getElementById('modal-close').addEventListener('click', () => modal.classList.remove('open'));
  document.getElementById('btn-cancel-modal').addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') modal.classList.remove('open');
  });

  // ── Add venue submit ────────────────────────────────────────
  form.addEventListener('submit', async e => {
    e.preventDefault();

    const errEl  = document.getElementById('form-error');
    const errMsg = document.getElementById('form-error-msg');
    errEl.style.display = 'none';

    const btn = document.getElementById('btn-save-venue');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const data = {
      name:         form.name.value.trim(),
      venue_type:   form.venue_type.value || null,
      contact_name: form.contact_name.value.trim() || null,
      email:        form.email.value.trim(),
      phone:        form.phone.value.trim() || null,
      address:      form.address.value.trim() || null,
      notes:        form.notes.value.trim() || null,
    };

    if (!data.name) {
      errMsg.textContent = 'Venue name is required.';
      errEl.style.display = '';
      btn.disabled = false;
      btn.textContent = 'Save Venue';
      return;
    }

    if (!data.email) {
      errMsg.textContent = 'Email is required.';
      errEl.style.display = '';
      btn.disabled = false;
      btn.textContent = 'Save Venue';
      return;
    }

    try {
      const newVenue = await API.venues.create(data);
      modal.classList.remove('open');
      toast('Venue created', 'success');
      window.location.href = 'venue.html?id=' + newVenue.id;
    } catch (err) {
      errMsg.textContent = err.message || 'Failed to create venue.';
      errEl.style.display = '';
      btn.disabled = false;
      btn.textContent = 'Save Venue';
    }
  });

  // ── Init ───────────────────────────────────────────────────
  loadVenues();
</script>
</body>
</html>
